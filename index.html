<!doctype html>

<head>

<title>Ôn tiếng Nhật</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>

<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <span class="cell brand-mark" aria-hidden="true"><span lang="ja">字</span></span>
      <h1>Ôn tiếng Nhật</h1>
    </div>
    <nav class="tabs" aria-label="Các phần ôn tập">
      <button class="tab" data-view="home"><span class="tab-ja" lang="ja" aria-hidden="true">目</span>Mục lục</button>
      <button class="tab" data-view="vocab"><span class="tab-ja" lang="ja" aria-hidden="true">語</span>Từ vựng</button>

      <button class="tab" data-view="grammar"><span class="tab-ja" lang="ja" aria-hidden="true">文</span>Ngữ pháp</button>
    </nav>
  </div>
</header>

<main class="wrap main">
  <section class="view" id="v-home" aria-label="Mục lục"></section>
  <section class="view" id="v-vocab" aria-label="Từ vựng" hidden></section>

  <section class="view" id="v-review" aria-label="Ôn hôm nay" hidden></section>
